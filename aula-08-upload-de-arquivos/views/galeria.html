{% extends "base.html" %}
{% block content %}
<h2 style="text-align:center">Galeria de Imagens</h2><br>
div class="container">
  <div class="container col-6">
    div class="card-body">
      <form method="POST" action="{{ url_for('galeria')}}" enctype="multipart/form-data">
       
          <label >Selecione uma imagem para enviar:</label>
          <input type="file" name="file" class="form-control" required><br>
        <button type="submit" class="btn btn-primary">Enviar</button> 
        </form>
        </div>
      </div>
  </div>
</h2> 
{% endfor %}
{% endblock content %}
