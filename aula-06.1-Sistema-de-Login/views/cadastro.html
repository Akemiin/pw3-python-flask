{% extends "base.html" %}

{% block content %}
 
<div class="container">
    <div class="card mt-4">
        <div class="card-header">
            <h3>Cadastro de usuário</h3></div>
        <div class="card-body">
            <form action="{{ url_for('cadastro') }}" method="post">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Digite seu e-mail">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Digite sua senha">
                <button type="submit" class="btn btn-danger btn-block">Cadastrar</button>
            </form>
    </div>
</div>

{% endblock content %}
