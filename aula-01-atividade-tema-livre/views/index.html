<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Kirby</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #ffe6f0, #ffffff);
            text-align: center;
            color: #5c3a2e; /* marrom claro */
        }

        h1 {
            background-color: #ffb6d9; /* rosa principal */
            color: white;
            padding: 25px;
            margin: 0;
            font-size: 2.2em;
            letter-spacing: 1px;
        }

        h3 {
            margin-top: 40px;
            font-weight: normal;
            color: #8b5e3c; /* marrom claro suave */
        }

        .container {
            background-color: white;
            margin: 40px auto;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(139, 94, 60, 0.2);
        }

        button {
            background-color: #ff85c1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e66aa8;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>Happy Kirb</h1>
    <h3>Bem vindo ao Happy Kirby! Sua loja de doces favorita!</h3>

    <div class="container">
        <h3>Rua Pereira Estéfano, Vila da Saúde, São Paulo, SP</h3>
    </div>

</body>
</html>
