<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Kirby</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #ffe6f2, #ffffff);
            text-align: center;
            color: #6d4c41; /* marrom claro */
        }

        h1 {
            background-color: #ff99cc; /* rosa principal */
            color: white;
            padding: 25px;
            margin: 0;
            font-size: 2.3em;
            letter-spacing: 1px;
        }

        hr {
            border: none;
            height: 3px;
            width: 60%;
            background-color: #d7a86e; /* marrom claro suave */
            margin: 30px auto;
            border-radius: 5px;
        }

        .container {
            background-color: white;
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(109, 76, 65, 0.2);
        }

        .endereco {
            font-size: 1.1em;
            margin-top: 15px;
        }

        button {
            background-color: #ff85c1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e66aa8;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>Venha nos visitar! 💕</h1>
    <hr>

    <div class="container">
        <p>Estamos esperando você com os doces mais deliciosos da região! 🍰</p>
        <p class="endereco">Rua Pereira Estéfano, Vila da Saúde, São Paulo - SP</p>
        <button>Ver Localização📍</button>
    </div>

</body>
</html>
