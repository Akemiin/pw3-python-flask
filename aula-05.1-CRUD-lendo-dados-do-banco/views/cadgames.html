{% extends 'base.html' %}

{% block content %}
<h2>Cadastro de Games</h2>
<hr>

<form action="{{ url_for('cadgames') }}" method="post">
    <label>Titulo</label>
    <input type="text" name="titulo" placeholder="Insira o título do jogo" class="form-control" required>
    <Label>Ano</Label>
    <input type="text" name="ano" placeholder="Insira o ano do jogo" class="form-control" required>
    <Label>Categoria</Label>
    <input type="text" name="categoria" placeholder="Insira a categoria do jogo" class="form-control" required>

    <input type="submit" value="Cadastrar" class="btn btn-success">
    <input type="reset" value="Limpar" class="btn btn-danger">
</form>
<br>
<hr>

<table class="table table-bordered table-hover">
    <thread>
        <tr>
            <th>Título</th>
            <th>Ano</th>
            <th>Categoria</th>
        </tr>
    </thread>
    <body>

        {% for game in listaGames %}
        <tr>
            <td>{{ game.titulo }}</td>
            <td>{{ game.ano }}</td>
            <td>{{ game.categoria }}</td>
        </tr>
        {% endfor %}
    </body>
</table>


{% endblock content %}
