<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Kirby - Cadastro de Doces</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #ffe6f2, #ffffff);
            text-align: center;
            color: #6d4c41; /* marrom claro */
        }

        h1 {
            background-color: #ff99cc; /* rosa principal */
            color: white;
            padding: 25px;
            margin: 0;
            font-size: 2.3em;
            letter-spacing: 1px;
        }

        hr {
            border: none;
            height: 3px;
            width: 60%;
            background-color: #d7a86e; /* marrom claro suave */
            margin: 30px auto;
            border-radius: 5px;
        }

        .container {
            background-color: white;
            width: 85%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(109, 76, 65, 0.2);
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid #d7a86e;
            font-size: 1em;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            background-color: #ff85c1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e66aa8;
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <h1>Cadastrar Doces 🍰</h1>
    <hr>

    <div class="container">
        <form>
            <label for="nome">Nome do Doce:</label>
            <input type="text" id="nome" placeholder="Nome do doce...">

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" placeholder="Descrição do doce..."></textarea>

            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" step="0.01" placeholder="Preço do doce...">

            <button type="submit">Cadastrar Doce 💕</button>
        </form>
    </div>

</body>
</html>
